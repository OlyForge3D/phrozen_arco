screw1_name:
  front_left
screw2:
    270, 30
screw2_name:
  front_right
screw3:
  270, 270
screw3_name:
  rear_right
screw4:
  30, 270
screw4_name:
  rear-left
speed: 150
horizontal_move_z: 10
screw_thread: CW-M4




# ==============================================================
# Dynamic Speed & Acceleration by Z Height (Klipper)
#
# PURPOSE:
# This macro set is designed specifically for **tall, narrow, or
# top-heavy prints** (towers, spires, vases, thin enclosures, etc.)
# where lateral stability decreases as Z height increases.
#
# By progressively reducing acceleration and global speed as the
# print gets taller, this system helps mitigate:
#   - Ringing and ghosting at higher Z
#   - Frame excitation and table sway
#   - Part deflection or wobble on slender geometries
#   - Risk of layer shifts late in long prints
#
# HOW IT WORKS:
# - A delayed_gcode loop periodically samples the current toolhead Z
# - Z is compared against two configurable height thresholds (z1, z2)
# - Based on the active Z range, the macro applies:
#     • A motion acceleration limit (SET_VELOCITY_LIMIT)
#     • A global speed scale (M220 %)
# - The loop automatically re-runs while enabled
#
# HEIGHT PROFILES:
# - Z < z1      → Full performance (fast / high accel)
# - z1 ≤ Z < z2 → Moderate slowdown
# - Z ≥ z2      → Conservative motion for tall, unstable sections
#
# ----------------------------------------------------------------
# MACRO OVERVIEW
#
# [gcode_macro KAOS_DYNAMIC_SPEED_ENABLE]
# - Enables dynamic Z-based speed control
# - Sets the internal enabled flag
# - Starts the delayed_gcode evaluation loop
#
# [gcode_macro KAOS_DYNAMIC_SPEED_DISABLE]
# - Disables dynamic control and stops the loop
# - Restores captured base acceleration (the value active at ENABLE time)
# - Resets global speed scaling to a known baseline (M220 S100)
#
# [gcode_macro _KAOS_DYNAMIC_SPEED]
# - Configuration and state holder only
# - Stores enable flag, Z thresholds, accel values, and speed profiles
# - Does NOT actively modify motion by itself
#
# [delayed_gcode KAOS_DYNAMIC_SPEED_LOOP]
# - Periodically evaluates current Z height
# - Selects the appropriate accel and speed profile
# - Applies changes using SET_VELOCITY_LIMIT and M220
# - Re-schedules itself while the feature is enabled
#
# USAGE NOTES:
# - Intended for tall, narrow, or mechanically sensitive prints
# - Affects global speed scaling (M220), not per-move feedrates
# - Should be disabled for motion tuning, input shaping tests,
#   or maximum-speed benchmarking
#
# ============================================================== 

[gcode_macro _KAOS_DYNAMIC_SPEED]
variable_enabled: 0
variable_last_band: -1
variable_base_accel: 0
gcode:
  _KAOS_LOG LEVEL=3 CATEGORY=DYNAMIC MSG="Dynamic speed macro ready."



[gcode_macro KAOS_DYNAMIC_SPEED_ENABLE]
description: Enable dynamic speed/accel based on Z height
gcode:
  # Safety: this feature reads current Z. Allow it only after real Z trust
  # or explicit power-loss recovery authorization.
  _KAOS_SAFETY_MODE_REQUIRE_TRUSTED_Z_OR_RECOVERY NAME="KAOS dynamic speed"

  # Capture slicer/start-gcode accel exactly as-is
  SET_GCODE_VARIABLE MACRO=_KAOS_DYNAMIC_SPEED VARIABLE=base_accel VALUE={printer.toolhead.max_accel|int}

  SET_GCODE_VARIABLE MACRO=_KAOS_DYNAMIC_SPEED VARIABLE=last_band VALUE=-1
  SET_GCODE_VARIABLE MACRO=_KAOS_DYNAMIC_SPEED VARIABLE=enabled VALUE=1

  _KAOS_LOG LEVEL=2 CATEGORY=DYNAMIC MSG="Dynamic speed ENABLED (original accel captured)."
  UPDATE_DELAYED_GCODE ID=KAOS_DYNAMIC_SPEED_LOOP DURATION=2.0


[gcode_macro KAOS_DYNAMIC_SPEED_DISABLE]
description: Disable dynamic speed/accel and restore original values
gcode:
  {% set ds = printer["gcode_macro _KAOS_DYNAMIC_SPEED"] %}

  SET_GCODE_VARIABLE MACRO=_KAOS_DYNAMIC_SPEED VARIABLE=enabled VALUE=0
  UPDATE_DELAYED_GCODE ID=KAOS_DYNAMIC_SPEED_LOOP DURATION=0

  # Restore captured acceleration exactly
  {% if ds.base_accel|int > 0 %}
    SET_VELOCITY_LIMIT ACCEL={ds.base_accel|int}
  {% endif %}

  # Optional but recommended: normalize speed factor
  # Uncomment if you want deterministic behavior
  M220 S100

  _KAOS_LOG LEVEL=2 CATEGORY=DYNAMIC MSG="Dynamic speed DISABLED (original accel restored)."


[delayed_gcode KAOS_DYNAMIC_SPEED_LOOP]
initial_duration: 0
gcode:
  {% set u = printer["gcode_macro _USER_CONFIG"] %}
  {% set ds = printer["gcode_macro _KAOS_DYNAMIC_SPEED"] %}
  {% set trusted_z = printer["gcode_macro _TRUSTED_HOME"].z|int %}
  {% set recovery = printer["gcode_macro _RECOVERY_STATE"].authorized|int %}

  {% if ds.enabled|int == 1 %}
    {% if trusted_z != 1 and recovery != 1 %}
      _KAOS_LOG LEVEL=0 CATEGORY=DYNAMIC MSG="Dynamic speed paused: Z is not trusted and recovery is not authorized."
      SET_GCODE_VARIABLE MACRO=_KAOS_DYNAMIC_SPEED VARIABLE=last_band VALUE=-1
      UPDATE_DELAYED_GCODE ID=KAOS_DYNAMIC_SPEED_LOOP DURATION=3.0
    {% else %}
      {% set z = printer.toolhead.position.z|float %}

      # Determine current band, BUT do nothing below z1
      {% if z < u.dynamic_z1|float %}
        {% set band = 0 %}
      {% elif z < u.dynamic_z2|float %}
        {% set band = 1 %}
      {% else %}
        {% set band = 2 %}
      {% endif %}

      # Only apply when crossing into a new band (and skip band 0)
      {% if band != ds.last_band|int %}
        SET_GCODE_VARIABLE MACRO=_KAOS_DYNAMIC_SPEED VARIABLE=last_band VALUE={band}

        {% if band == 1 %}
          SET_VELOCITY_LIMIT ACCEL={u.dynamic_accel_mid|int}
          M220 S{u.dynamic_speed_mid|int}
          _KAOS_LOG LEVEL=2 CATEGORY=DYNAMIC MSG="Z={z|round(1)}: MID profile applied."
        {% elif band == 2 %}
          SET_VELOCITY_LIMIT ACCEL={u.dynamic_accel_high|int}
          M220 S{u.dynamic_speed_high|int}
          _KAOS_LOG LEVEL=2 CATEGORY=DYNAMIC MSG="Z={z|round(1)}: HIGH profile applied."
        {% endif %}
      {% endif %}

      UPDATE_DELAYED_GCODE ID=KAOS_DYNAMIC_SPEED_LOOP DURATION=3.0
    {% endif %}
  {% endif %}


gcode:


#####################################################################
# Trusted physical homing guard
# Do not rely on printer.toolhead.homed_axes on this printer because
# startup SET_KINEMATIC_POSITION can make Klipper believe XYZ is homed.
#####################################################################
[gcode_macro _TRUSTED_HOME]
variable_xy: 0
variable_z: 0
variable_xyz: 0
gcode:
    RESPOND MSG="Trusted home state: XY={printer['gcode_macro _TRUSTED_HOME'].xy}, Z={printer['gcode_macro _TRUSTED_HOME'].z}, XYZ={printer['gcode_macro _TRUSTED_HOME'].xyz}"

[gcode_macro _CLEAR_TRUSTED_HOME]
gcode:
    SET_GCODE_VARIABLE MACRO=_TRUSTED_HOME VARIABLE=xy VALUE=0
    SET_GCODE_VARIABLE MACRO=_TRUSTED_HOME VARIABLE=z VALUE=0
    SET_GCODE_VARIABLE MACRO=_TRUSTED_HOME VARIABLE=xyz VALUE=0

[gcode_macro _SET_TRUSTED_XY]
gcode:
    SET_GCODE_VARIABLE MACRO=_TRUSTED_HOME VARIABLE=xy VALUE=1
    {% if printer['gcode_macro _TRUSTED_HOME'].z|int == 1 %}
        SET_GCODE_VARIABLE MACRO=_TRUSTED_HOME VARIABLE=xyz VALUE=1
    {% endif %}

[gcode_macro _SET_TRUSTED_Z]
gcode:
    SET_GCODE_VARIABLE MACRO=_TRUSTED_HOME VARIABLE=z VALUE=1
    {% if printer['gcode_macro _TRUSTED_HOME'].xy|int == 1 %}
        SET_GCODE_VARIABLE MACRO=_TRUSTED_HOME VARIABLE=xyz VALUE=1
    {% endif %}

[gcode_macro _SET_TRUSTED_XYZ]
gcode:
    SET_GCODE_VARIABLE MACRO=_TRUSTED_HOME VARIABLE=xy VALUE=1
    SET_GCODE_VARIABLE MACRO=_TRUSTED_HOME VARIABLE=z VALUE=1
    SET_GCODE_VARIABLE MACRO=_TRUSTED_HOME VARIABLE=xyz VALUE=1

[gcode_macro _RECOVERY_STATE]
# This is NOT persisted and does not mean the printer is physically homed.
# It is a temporary user-authorized bypass for power-loss recovery / continue-print workflows.
variable_authorized: 0
gcode:
    RESPOND MSG="Recovery authorized={printer['gcode_macro _RECOVERY_STATE'].authorized}"

[gcode_macro AUTHORIZE_POWER_LOSS_RECOVERY]
#Allow movement after power loss. Bypass homing requirements
gcode:
    SET_GCODE_VARIABLE MACRO=_RECOVERY_STATE VARIABLE=authorized VALUE=1
    RESPOND TYPE=command MSG="Power-loss recovery motion authorized by user. This does not prove physical homing."

[gcode_macro _CLEAR_RECOVERY_AUTH]
# Remove Power-loss recovery motion authorization
gcode:
    SET_GCODE_VARIABLE MACRO=_RECOVERY_STATE VARIABLE=authorized VALUE=0

[gcode_macro _KAOS_SAFETY_MODE_CONFIG]
# 0 = Safe mode: vendor/macro guards only; raw G0/G1 from Fluidd/manual jogging allowed.
# 1 = Bulletproof mode: raw G0/G1 also blocked unless trusted or recovery-authorized.
variable_bulletproof_motion_guard: 0
# Internal bypass used only during homing/recovery-safe internal routines. Leave at 0.
variable_motion_guard_bypass: 0
gcode:
    RESPOND MSG="Bulletproof motion guard={printer['gcode_macro _KAOS_SAFETY_MODE_CONFIG'].bulletproof_motion_guard}, internal bypass={printer['gcode_macro _KAOS_SAFETY_MODE_CONFIG'].motion_guard_bypass}"

[gcode_macro KAOS_SAFETY_MODE_SAFE]
gcode:
    SET_GCODE_VARIABLE MACRO=_KAOS_SAFETY_MODE_CONFIG VARIABLE=bulletproof_motion_guard VALUE=0
    RESPOND TYPE=command MSG="Safety mode: SAFE. Macro guards active raw G0/G1 movement allowed, so Fluidd move arrows work."

[gcode_macro KAOS_SAFETY_MODE_BULLETPROOF]
gcode:
    SET_GCODE_VARIABLE MACRO=_KAOS_SAFETY_MODE_CONFIG VARIABLE=bulletproof_motion_guard VALUE=1
    RESPOND TYPE=command MSG="Safety mode: BULLETPROOF. Raw G0/G1 blocked unless trusted, recovery-authorized, or internally bypassed."

[gcode_macro _KAOS_SAFETY_MODE_ENABLE_INTERNAL_MOTION_BYPASS]
gcode:
    SET_GCODE_VARIABLE MACRO=_KAOS_SAFETY_MODE_CONFIG VARIABLE=motion_guard_bypass VALUE=1

[gcode_macro _KAOS_SAFETY_MODE_DISABLE_INTERNAL_MOTION_BYPASS]
gcode:
    SET_GCODE_VARIABLE MACRO=_KAOS_SAFETY_MODE_CONFIG VARIABLE=motion_guard_bypass VALUE=0

[gcode_macro _REQUIRE_TRUSTED_XY]
gcode:
    {% set trusted = printer['gcode_macro _TRUSTED_HOME'].xy|int %}
    {% set recovery = printer['gcode_macro _RECOVERY_STATE'].authorized|int %}
    {% if trusted != 1 and recovery != 1 %}
        { action_raise_error("Blocked: trusted XY home or user-authorized recovery required. Run PG28/G28 first, or AUTHORIZE_POWER_LOSS_RECOVERY only for power-loss continue.") }
    {% endif %}

[gcode_macro _REQUIRE_TRUSTED_Z]
gcode:
    {% set trusted = printer['gcode_macro _TRUSTED_HOME'].z|int %}
    {% set recovery = printer['gcode_macro _RECOVERY_STATE'].authorized|int %}
    {% if trusted != 1 and recovery != 1 %}
        { action_raise_error("Blocked: trusted Z home or user-authorized recovery required. Run PG28/G28 first, or AUTHORIZE_POWER_LOSS_RECOVERY only for power-loss continue.") }
    {% endif %}

[gcode_macro _REQUIRE_TRUSTED_XYZ]
gcode:
    {% set trusted = printer['gcode_macro _TRUSTED_HOME'].xyz|int %}
    {% set recovery = printer['gcode_macro _RECOVERY_STATE'].authorized|int %}
    {% if trusted != 1 and recovery != 1 %}
        { action_raise_error("Blocked: trusted XYZ home or user-authorized recovery required. Run PG28/G28 first, or AUTHORIZE_POWER_LOSS_RECOVERY only for power-loss continue.") }
    {% endif %}