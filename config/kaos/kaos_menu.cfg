# -----------------------------------------------------------------------------
# Full Bed Mesh + Tilt guided flow
# -----------------------------------------------------------------------------

[gcode_macro _KAOS_MENU_FULL_MESH_SELECT]
description: Menu action - choose full bed mesh grid size
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Full Bed Mesh + Tilt"
    RESPOND TYPE=command MSG="action:prompt_text Choose full-bed mesh density:"
    RESPOND TYPE=command MSG="action:prompt_button 7 x 7 Full Mesh|_KAOS_MENU_CONFIRM_FULL_MESH_7"
    RESPOND TYPE=command MSG="action:prompt_button 9 x 9 Full Mesh|_KAOS_MENU_CONFIRM_FULL_MESH_9"
    RESPOND TYPE=command MSG="action:prompt_button 11 x 11 Full Mesh|_KAOS_MENU_CONFIRM_FULL_MESH_11"
    RESPOND TYPE=command MSG="action:prompt_button Back|_KAOS_MENU_OPEN_CALIBRATION"
    RESPOND TYPE=command MSG="action:prompt_button Cancel|_KAOS_MENU_CANCEL"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _KAOS_MENU_CONFIRM_FULL_MESH_7]
description: Menu action - confirm 5x5 full bed mesh with tilt
gcode:
    _KAOS_MENU_CONFIRM_FULL_MESH GRID=5

[gcode_macro _KAOS_MENU_CONFIRM_FULL_MESH_7]
description: Menu action - confirm 7x7 full bed mesh with tilt
gcode:
    _KAOS_MENU_CONFIRM_FULL_MESH GRID=7

[gcode_macro _KAOS_MENU_CONFIRM_FULL_MESH_9]
description: Menu action - confirm 9x9 full bed mesh with tilt
gcode:
    _KAOS_MENU_CONFIRM_FULL_MESH GRID=9

[gcode_macro _KAOS_MENU_CONFIRM_FULL_MESH_11]
description: Menu action - confirm 11x11 full bed mesh with tilt
gcode:
    _KAOS_MENU_CONFIRM_FULL_MESH GRID=11

[gcode_macro _KAOS_MENU_CONFIRM_FULL_MESH]
description: Menu action - shared full bed mesh confirmation screen
gcode:
    {% set grid = params.GRID|default(7)|int %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Confirm Full Bed Mesh"
    RESPOND TYPE=command MSG="action:prompt_text Full Bed Mesh + Tilt"
    RESPOND TYPE=command MSG="action:prompt_text Grid: {grid} x {grid}"
    RESPOND TYPE=command MSG="action:prompt_text Nozzle: 140C"
    RESPOND TYPE=command MSG="action:prompt_text Bed: 60C"
    RESPOND TYPE=command MSG="action:prompt_text This will heat, home, run Z tilt, clear the active mesh, then probe the full bed."
    RESPOND TYPE=command MSG="action:prompt_button Continue|KAOS_FULL_MESH_WITH_TILT GRID={grid}"
    RESPOND TYPE=command MSG="action:prompt_button Back|_KAOS_MENU_FULL_MESH_SELECT"
    RESPOND TYPE=command MSG="action:prompt_button Cancel|_KAOS_MENU_CANCEL"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro KAOS_FULL_MESH_WITH_TILT]
description: Heat to 140/60, home, Z tilt, then run full bed mesh with selected grid
gcode:
    {% set grid = params.GRID|default(7)|int %}

    {% if grid not in [7, 9, 11] %}
        {action_raise_error("KAOS_FULL_MESH_WITH_TILT: GRID must be 7, 9, or 11")}
    {% endif %}

    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND MSG="KAOS: Starting full bed mesh with Z tilt. Grid={grid}x{grid}, nozzle=140C, bed=60C"

    M107
    G90

    M140 S60
    M104 S140
    M190 S60
    M109 S140

    PG28

    Z_TILT_ONCE

    PRZ_WIPEMOUTH

    M106 S255

    BED_MESH_CLEAR

    BED_MESH_CALIBRATE MESH_MIN=10,10 MESH_MAX=290,290 PROBE_COUNT={grid},{grid} ALGORITHM=bicubic PROFILE=default

    M106 S0

    RESPOND MSG="KAOS: Full bed mesh complete. Review the mesh, then use Save Config if you want to persist it."


[gcode_macro _KAOS_MENU_LOAD_DEFAULT_MESH]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    BED_MESH_PROFILE LOAD=default

[gcode_macro _KAOS_MENU_CLEAR_MESH]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    BED_MESH_CLEAR

[gcode_macro _KAOS_MENU_MESH_STATUS]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    BED_MESH_OUTPUT

[gcode_macro _KAOS_MENU_SAVE_PHROZEN_MESH]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    BED_MESH_PROFILE SAVE=phrozen
    SAVE_CONFIG

[gcode_macro _KAOS_MENU_Z_TILT_ONCE]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    Z_TILT_ONCE

[gcode_macro _KAOS_MENU_Z_TILT_ADJUST]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    Z_TILT_ADJUST

[gcode_macro _KAOS_MENU_Z_TILT_CLEAR]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    Z_TILT_CLEAR

[gcode_macro _KAOS_MENU_SCREWS_TILT]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    SCREWS_TILT_CALCULATE


